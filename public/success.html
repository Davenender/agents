<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zahlung erfolgreich</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #f0f4f8; margin: 0;
    }
    .card {
      background: white; border-radius: 12px; padding: 48px 40px;
      text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 440px; width: 100%;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { color: #22c55e; margin: 0 0 12px; font-size: 1.6rem; }
    p { color: #6b7280; line-height: 1.6; margin: 0 0 8px; }
    .email-status { margin-top: 20px; font-size: 14px; color: #9ca3af; }
    .email-status.success { color: #22c55e; }
    .email-status.error { color: #ef4444; }
    a { color: #635bff; text-decoration: none; font-weight: 500; }
    .back { display: inline-block; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Zahlung erfolgreich!</h1>
    <p>Vielen Dank für deinen Kauf von <strong>Produkt X</strong>.</p>
    <p>Du erhältst in Kürze eine Bestätigungsmail.</p>

    <div class="email-status" id="email-status">📧 Bestätigungsmail wird gesendet…</div>

    <a href="/" class="back">← Zurück zur Startseite</a>
  </div>

  <script>
    // session_id aus URL auslesen und Bestätigungsmail auslösen
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");
      const statusEl = document.getElementById("email-status");

      if (!sessionId) {
        statusEl.textContent = "";
        return;
      }

      try {
        const res = await fetch("/send-confirmation", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId }),
        });
        const data = await res.json();

        if (data.success) {
          statusEl.textContent = "✅ Bestätigungsmail wurde gesendet!";
          statusEl.className = "email-status success";
        } else {
          statusEl.textContent = "⚠️ Mail konnte nicht gesendet werden: " + (data.error || "Unbekannter Fehler");
          statusEl.className = "email-status error";
        }
      } catch (err) {
        statusEl.textContent = "⚠️ Verbindungsfehler beim Mailversand.";
        statusEl.className = "email-status error";
      }
    })();
  </script>
</body>
</html>
